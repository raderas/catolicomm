<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catolicomm - Vamos a misa!{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #FDFBF7;
            --surface: #FFFFFF;
            --text-main: #3E2723;
            --text-muted: #6D4C41;
            --accent-gold: #D9A036;
            --accent-cream: #F3E5AB;
            --border-subtle: #E0D5C1;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, .font-serif {
            font-family: 'Lora', serif;
        }

        /* Utilidades de color adaptadas */
        .bg-surface { background-color: var(--surface); }
        .text-brand-primary { color: var(--text-main); }
        .text-brand-muted { color: var(--text-muted); }
        .bg-cream-accent { background-color: var(--accent-cream); }
        .border-subtle { border-color: var(--border-subtle) !important; }

        /* Botones personalizados */
        .btn-gold {
            background-color: var(--accent-gold);
            color: #FFFFFF;
            border: none;
            font-weight: 500;
        }
        .btn-gold:hover {
            background-color: #c48e2e;
            color: #FFFFFF;
        }

        .btn-outline-brand {
            border: 1px solid var(--text-main);
            color: var(--text-main);
        }
        .btn-outline-brand:hover {
            background-color: var(--text-main);
            color: #FFFFFF;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-surface border-bottom border-subtle sticky-top">
        <div class="container">
            <a class="navbar-brand font-serif fw-bold text-brand-primary fs-4" href="{% url 'misas:index' %}">
                <i class="bi bi-church text-warning me-1"></i> MisasApp
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-brand-primary fw-medium" href="#">Templos</a></li>
                    <li class="nav-item"><a class="nav-link text-brand-primary fw-medium" href="#">Horarios</a></li>
                    <li class="nav-item"><a class="nav-link text-brand-primary fw-medium" href="#">Mapa</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-surface border-top border-subtle py-3 mt-auto">
        <div class="container text-center text-brand-muted fs-7">
            <small>&copy; {% now "Y" %} Catolicomm — Información de templos y horarios de misas, confesiones y otros servicios.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
