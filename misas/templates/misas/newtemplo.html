<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar un Templo - Catolicomm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <form action="{% url 'misas:newtemplo' %}" method=""post">
        {% csrf_token %} 
        <fieldset>
            <legend><h1>Nuevo Templo</h1></legend>
            {% if error_message %} <p><strong>{{ error_message }}</strong></p>{% endif %}
            <input type="textbox" name="nombre_templo" id="txt_nombre">
            <label for="txt_nombre">Nombre del Templo:</label><br>
            <input type="textbox" name="direccion_templo" id="txt_direccion">
            <label for="txt_direccion">Direccion:</label>
            <input type="textbox" name="alias_templo" id="txt_alias">
            <label for="txt_alias">Otro nombre reconocido:</label>
        </fieldset>
        <input type="submit" value="Guardar">
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
