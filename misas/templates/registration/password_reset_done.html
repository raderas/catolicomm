{% extends "base.html" %}

{% block title %}Revisa tu correo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card bg-surface border-subtle shadow-sm rounded-3 p-4">
            <h1 class="font-serif text-brand-primary h3 mb-2">Revisa tu correo</h1>
            <p class="text-brand-muted mb-3">Si la cuenta existe, enviamos un correo con un enlace para restablecer la contraseña.</p>
            <p class="mb-0">
                <a href="{% url 'login' %}">Iniciar sesión</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
